# Compatibility alias for environments expecting dockerCompose.yml.
# Keep in sync with compose.yaml (source of truth).
services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    cpus: 0.5
    mem_limit: 200m

volumes:
  caddy_data:
  caddy_config:
