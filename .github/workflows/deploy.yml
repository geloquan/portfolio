name: Deploy Portfolio to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/geloquan/portfolio
  DEPLOY_LOCAL_TAG: portfolio-app:local

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: DEPLOY_LOCAL_TAG
          script: |
            set -euo pipefail
            LOG_FILE="$HOME/portfolio-deploy.log"
            DEPLOY_DIR="$HOME/portfolio"
            DEPLOY_KEY_PATH="$HOME/.ssh/portfolio_deploy_key"
            REPO_SSH_URL="git@github.com:geloquan/portfolio.git"
            SSH_COMMAND="ssh -i $DEPLOY_KEY_PATH -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

            exec > >(tee -a "$LOG_FILE") 2>&1

            log() {
              printf '%s %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" "$1"
            }

            fail() {
              log "❌ $1"
              exit 1
            }

            check_deployment_keys() {
              log "🔐 Validating deployment key: $DEPLOY_KEY_PATH"
              if [ ! -f "$DEPLOY_KEY_PATH" ]; then
                fail "Deployment key not found. Run ./generate-deploy-keys.sh on the VPS, then add ${DEPLOY_KEY_PATH}.pub as a read-only deploy key at https://github.com/geloquan/portfolio/settings/keys."
              fi

              if [ ! -f "${DEPLOY_KEY_PATH}.pub" ]; then
                fail "Public deployment key not found at ${DEPLOY_KEY_PATH}.pub. Re-run ./generate-deploy-keys.sh on the VPS and add the public key to GitHub deploy keys."
              fi

              chmod 600 "$DEPLOY_KEY_PATH"
              chmod 644 "${DEPLOY_KEY_PATH}.pub"
            }

            sync_repository() {
              if [ -d "$DEPLOY_DIR/.git" ]; then
                log "📥 Updating existing repository in $DEPLOY_DIR"
                cd "$DEPLOY_DIR"
                GIT_SSH_COMMAND="$SSH_COMMAND" git remote set-url origin "$REPO_SSH_URL"
                GIT_SSH_COMMAND="$SSH_COMMAND" git fetch --prune origin main
                GIT_SSH_COMMAND="$SSH_COMMAND" git checkout -B main origin/main
              elif [ -d "$DEPLOY_DIR" ]; then
                fail "$DEPLOY_DIR exists but is not a git repository. Move it aside or initialize it correctly before deploying."
              else
                log "📥 Cloning repository into $DEPLOY_DIR"
                tmp_dir="$(mktemp -d "$HOME/portfolio.clone.XXXXXX")"
                trap 'rm -rf "$tmp_dir"' EXIT
                GIT_SSH_COMMAND="$SSH_COMMAND" git clone --branch main --single-branch "$REPO_SSH_URL" "$tmp_dir"
                mv "$tmp_dir" "$DEPLOY_DIR"
                trap - EXIT
              fi
            }

            log "🚀 Starting secure Portfolio deployment (Caddy stack)..."
            check_deployment_keys
            sync_repository

            cd "$DEPLOY_DIR"
            log "♻️ Restarting stack (portfolio + caddy)..."
            docker compose up -d --build

            log "🧹 Cleaning up old images..."
            docker image prune -f

            log "✅ Verifying deployment..."
            docker compose ps

            log "========================================"
            log "✅ Portfolio deployment complete!"
            log "Services: portfolio, caddy"
            log "Domains: marcoangeloquanico.work, www.marcoangeloquanico.work"
            docker compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"
