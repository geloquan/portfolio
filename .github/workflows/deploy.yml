name: Deploy Portfolio to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/geloquan/portfolio
  DEPLOY_LOCAL_TAG: portfolio-app:local

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: DEPLOY_LOCAL_TAG
          script: |
            set -euo pipefail
            LOG_FILE="$HOME/portfolio-deploy.log"
            DEPLOY_DIR="$HOME/portfolio"
            DEPLOY_KEY_PATH="$HOME/.ssh/portfolio_deploy_key"
            KNOWN_HOSTS_FILE="$HOME/.ssh/known_hosts"
            REPO_SLUG="geloquan/portfolio"
            REPO_SSH_URL="git@github.com:${REPO_SLUG}.git"
            REPO_SETTINGS_URL="https://github.com/${REPO_SLUG}/settings/keys"
            SSH_COMMAND="ssh -i $DEPLOY_KEY_PATH -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS_FILE"

            exec > >(tee -a "$LOG_FILE") 2>&1

            log() {
              printf '%s %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" "$1"
            }

            fail() {
              log "❌ $1"
              exit 1
            }

            check_deployment_keys() {
              log "🔐 Validating deployment key: $DEPLOY_KEY_PATH"
              if [ ! -f "$DEPLOY_KEY_PATH" ]; then
                fail "Deployment key not found. Run ./generate-deploy-keys.sh on the VPS, then add ${DEPLOY_KEY_PATH}.pub as a read-only deploy key at $REPO_SETTINGS_URL."
              fi

              if [ ! -f "${DEPLOY_KEY_PATH}.pub" ]; then
                fail "Public deployment key not found at ${DEPLOY_KEY_PATH}.pub. Re-run ./generate-deploy-keys.sh on the VPS and add the public key to GitHub deploy keys."
              fi

              chmod 600 "$DEPLOY_KEY_PATH"
              chmod 644 "${DEPLOY_KEY_PATH}.pub"
            }

            ensure_known_hosts() {
              mkdir -p "$HOME/.ssh"
              chmod 700 "$HOME/.ssh"
              touch "$KNOWN_HOSTS_FILE"
              chmod 644 "$KNOWN_HOSTS_FILE"
              if ! ssh-keygen -F github.com -f "$KNOWN_HOSTS_FILE" > /dev/null; then
                log "🔑 Adding github.com to known_hosts"
                ssh-keyscan -H github.com >> "$KNOWN_HOSTS_FILE" || fail "Unable to add github.com host key to known_hosts."
              fi
            }

            sync_repository() {
              if [ -d "$DEPLOY_DIR/.git" ]; then
                log "📥 Updating existing repository in $DEPLOY_DIR"
                cd "$DEPLOY_DIR"
                GIT_SSH_COMMAND="$SSH_COMMAND" git remote set-url origin "$REPO_SSH_URL"
                GIT_SSH_COMMAND="$SSH_COMMAND" git fetch --prune origin
                if ! git rev-parse --verify --quiet origin/main; then
                  fail "Remote branch origin/main not found after fetch. Verify the branch exists and the deploy key has repository access."
                fi
                if ! git checkout main; then
                  git checkout -b main
                fi
                git reset --hard origin/main
              elif [ -d "$DEPLOY_DIR" ]; then
                fail "$DEPLOY_DIR exists but is not a git repository. Move it aside or initialize it correctly before deploying."
              else
                log "📥 Cloning repository into $DEPLOY_DIR"
                GIT_SSH_COMMAND="$SSH_COMMAND" git clone --branch main --single-branch "$REPO_SSH_URL" "$DEPLOY_DIR"
              fi
            }

            free_port_from_docker_containers() {
              local port="$1"
              local containers
              containers="$(docker ps --filter "publish=${port}" --format "{{.ID}} {{.Names}}" || true)"
              if [ -z "$containers" ]; then
                return
              fi

              log "⚠️ Port ${port} is in use by Docker container(s). Releasing it before deploy..."
              while IFS=' ' read -r container_id container_name; do
                [ -z "$container_id" ] && continue
                log "🛑 Stopping container ${container_name:-$container_id} (ID: $container_id) using port ${port}"
                docker stop "$container_id" || fail "Failed to stop container $container_id while releasing port ${port}."
                docker rm "$container_id" || fail "Failed to remove container $container_id while releasing port ${port}."
              done <<< "$containers"
            }

            verify_port_available() {
              local port="$1"
              local in_use
              in_use=""

              if command -v ss >/dev/null 2>&1; then
                in_use="$(ss -ltnH | awk '{print $4}' | grep -E "[:.]${port}$" || true)"
              elif command -v netstat >/dev/null 2>&1; then
                in_use="$(netstat -ltn 2>/dev/null | awk '{print $4}' | grep -E "[:.]${port}$" || true)"
              else
                fail "Unable to verify port ${port} availability (neither ss nor netstat is installed)."
              fi

              if [ -n "$in_use" ]; then
                fail "Port ${port} is still in use by a non-Docker process. Stop the process and re-run deployment."
              fi
            }

            log "🚀 Starting secure Portfolio deployment (Caddy stack)..."
            check_deployment_keys
            ensure_known_hosts
            sync_repository

            cd "$DEPLOY_DIR"
            free_port_from_docker_containers 80
            free_port_from_docker_containers 443
            verify_port_available 80
            verify_port_available 443
            log "♻️ Restarting stack (portfolio + caddy)..."
            docker compose up -d --build

            log "🧹 Cleaning up old images..."
            docker image prune -f

            log "✅ Verifying deployment..."
            docker compose ps

            log "========================================"
            log "✅ Portfolio deployment complete!"
            log "Services: portfolio, caddy"
            log "Domains: marcoangeloquanico.work, www.marcoangeloquanico.work"
            docker compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"
