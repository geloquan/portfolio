name: Deploy Portfolio to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting deployment of Portfolio..."

            echo "📥 Pulling latest changes..."
            cd ~/portfolio

            GIT_SSH_COMMAND='ssh -i ~/.ssh/portfolio_deploy_key' git remote set-url origin git@github.com:geloquan/portfolio.git

            GIT_SSH_COMMAND='ssh -i ~/.ssh/portfolio_deploy_key' git fetch origin
            GIT_SSH_COMMAND='ssh -i ~/.ssh/portfolio_deploy_key' git fetch --all
            GIT_SSH_COMMAND='ssh -i ~/.ssh/portfolio_deploy_key' git checkout main
            GIT_SSH_COMMAND='ssh -i ~/.ssh/portfolio_deploy_key' git status
            GIT_SSH_COMMAND='ssh -i ~/.ssh/portfolio_deploy_key' git reset --hard origin/main

            # Return to deployment root
            cd ~/mabdoc-deploy

            # Rebuild the portfolio Docker image
            echo "🔨 Building Docker image (this may take 2-5 minutes)..."
            docker compose build portfolio

            # Restart the service with zero downtime
            echo "♻️  Restarting service..."
            docker compose up -d portfolio

            # Clean up old images to free disk space
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            # Verify deployment
            echo "✅ Verifying deployment..."
            docker compose ps portfolio

            echo ""
            echo "========================================"
            echo "✅ Portfolio deployment complete!"
            echo "========================================"
            echo "Service: portfolio"
            echo "Domain: www.marcoangeloquanico.work"
            echo "Container status:"
            docker compose ps portfolio --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"
