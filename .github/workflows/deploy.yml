name: Deploy Portfolio to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/geloquan/portfolio
  DEPLOY_LOCAL_TAG: portfolio-app:local

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push portfolio image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: portfolio
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLOUDFLARE_R2_PROFILE_IMAGE_URL=${{ secrets.CLOUDFLARE_R2_PROFILE_IMAGE_URL }}
            CLOUDFLARE_R2_PROJECT_ONE_MEDIA_URL=${{ secrets.CLOUDFLARE_R2_PROJECT_ONE_MEDIA_URL }}
            CLOUDFLARE_R2_PROJECT_TWO_MEDIA_URL=${{ secrets.CLOUDFLARE_R2_PROJECT_TWO_MEDIA_URL }}
            CLOUDFLARE_R2_PROJECT_THREE_MEDIA_URL=${{ secrets.CLOUDFLARE_R2_PROJECT_THREE_MEDIA_URL }}
            CLOUDFLARE_R2_PROJECT_FOUR_MEDIA_URL=${{ secrets.CLOUDFLARE_R2_PROJECT_FOUR_MEDIA_URL }}
            VITE_PROJECT_ONE_YOUTUBE_URL=${{ secrets.VITE_PROJECT_ONE_YOUTUBE_URL }}
            VITE_PROJECT_TWO_YOUTUBE_URL=${{ secrets.VITE_PROJECT_TWO_YOUTUBE_URL }}
            VITE_PROJECT_ONE_FACEBOOK_URL=${{ secrets.VITE_PROJECT_ONE_FACEBOOK_URL }}
            VITE_PROJECT_THREE_FACEBOOK_URL=${{ secrets.VITE_PROJECT_THREE_FACEBOOK_URL }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          DEPLOY_LOCAL_TAG: ${{ env.DEPLOY_LOCAL_TAG }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: DEPLOY_IMAGE,DEPLOY_LOCAL_TAG,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            echo "🚀 Starting deployment of Portfolio..."

            echo "📥 Pulling latest changes..."
            cd ~/portfolio

            GIT_SSH_COMMAND='ssh -i ~/.ssh/portfolio_deploy_key' git remote set-url origin git@github.com:geloquan/portfolio.git

            GIT_SSH_COMMAND='ssh -i ~/.ssh/portfolio_deploy_key' git fetch origin
            GIT_SSH_COMMAND='ssh -i ~/.ssh/portfolio_deploy_key' git fetch --all
            GIT_SSH_COMMAND='ssh -i ~/.ssh/portfolio_deploy_key' git checkout main
            GIT_SSH_COMMAND='ssh -i ~/.ssh/portfolio_deploy_key' git status
            GIT_SSH_COMMAND='ssh -i ~/.ssh/portfolio_deploy_key' git reset --hard origin/main

            # Return to deployment root
            cd ~/mabdoc-deploy

            if [ -z "${GHCR_USERNAME}" ] || [ -z "${GHCR_TOKEN}" ]; then
              echo "❌ Missing GHCR credentials. Configure GHCR_USERNAME and GHCR_TOKEN secrets on this repository."
              exit 1
            fi

            echo "🔐 Logging in to GHCR..."
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            echo "📦 Pulling image ${DEPLOY_IMAGE}..."
            docker pull "${DEPLOY_IMAGE}"
            docker tag "${DEPLOY_IMAGE}" "${DEPLOY_LOCAL_TAG}"

            # Restart the service with zero downtime
            echo "♻️  Restarting service..."
            docker compose up -d portfolio

            # Clean up old images to free disk space
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            # Verify deployment
            echo "✅ Verifying deployment..."
            docker compose ps portfolio

            echo ""
            echo "========================================"
            echo "✅ Portfolio deployment complete!"
            echo "========================================"
            echo "Service: portfolio"
            echo "Domain: www.marcoangeloquanico.work"
            echo "Container status:"
            docker compose ps portfolio --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"
