services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    cpus: 0.5
    mem_limit: 200m

volumes:
  caddy_data:
  caddy_config:
