services:
  caddy:
    environment:
      CLOUDFLARE_R2_ACCESS_KEY_ID : ${CLOUDFLARE_R2_ACCESS_KEY_ID}
      VITE_PROJECT_ONE_MEDIA_URL : ${VITE_PROJECT_ONE_MEDIA_URL}
      VITE_PROJECT_TWO_MEDIA_URL : ${VITE_PROJECT_TWO_MEDIA_URL}
      VITE_PROJECT_THREE_MEDIA_URL : ${VITE_PROJECT_THREE_MEDIA_URL}
      VITE_PROJECT_FOUR_MEDIA_URL : ${VITE_PROJECT_FOUR_MEDIA_URL}
      VITE_PROJECT_ONE_YOUTUBE_URL : ${VITE_PROJECT_ONE_YOUTUBE_URL}
      VITE_PROJECT_TWO_YOUTUBE_URL : ${VITE_PROJECT_TWO_YOUTUBE_URL}
      VITE_PROJECT_ONE_FACEBOOK_URL : ${VITE_PROJECT_ONE_FACEBOOK_URL}
      VITE_PROJECT_THREE_FACEBOOK_URL : ${VITE_PROJECT_THREE_FACEBOOK_URL}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY : ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      CLOUDFLARE_R2_TOKEN_VALUE : ${CLOUDFLARE_R2_TOKEN_VALUE}
      CLOUDFLARE_R2_BUCKET_NAME : ${CLOUDFLARE_R2_BUCKET_NAME}
      CLOUDFLARE_R2_S3_ENDPOINT : ${CLOUDFLARE_R2_S3_ENDPOINT}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    cpus: 0.5
    mem_limit: 200m

volumes:
  caddy_data:
  caddy_config:
