  <!-- ─── Theme colour (browser chrome) ───────────────────────────── -->
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#efefea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1110" media="(prefers-color-scheme: dark)" />
  <script>
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.setAttribute('content', savedTheme === 'dark' ? '#0e1110' : '#efefea');
          meta.removeAttribute('media');
        });
      }
    } catch (_) {}
  </script>
